<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soham Shinde | The Sketchbook</title>

<style>

/* RESET */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #d6c2aa;
    color: #2c241e;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,255,255,0.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(139,95,65,0.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 40% 90%,
            rgba(110,75,50,0.16),
            transparent 35%
        );
}


/* HERO */

header {
    min-height: 100vh;
    padding: 45px 30px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(121,83,59,0.25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eadcca,
            #d3bca0,
            #b99b7d
        );
}


/* MOVING LIGHT */

header::after {
    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    background: rgba(255,255,255,0.17);

    filter: blur(75px);

    right: -100px;
    top: 15%;

    animation: floatingLight 8s ease-in-out infinite alternate;
}

@keyframes floatingLight {

    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(100px);
    }
}


/* ARTIST NAME */

.artist {
    font-family: "Times New Roman", serif;

    font-size: 18px;

    letter-spacing: 7px;

    color: #493a2f;

    text-transform: uppercase;

    margin-bottom: 65px;

    opacity: 0;

    animation: fadeUp 1s ease forwards;
}


/* SMALL TITLE */

.small {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #705f50;

    text-transform: uppercase;

    margin-bottom: 25px;

    opacity: 0;

    animation: fadeUp 1s ease 0.2s forwards;
}


/* MAIN TITLE */

h1 {
    font-size: clamp(60px, 14vw, 135px);

    line-height: 0.82;

    font-weight: 400;

    letter-spacing: -6px;

    color: #2c241e;

    opacity: 0;

    animation: titleReveal 1.3s ease 0.3s forwards;
}

@keyframes titleReveal {

    from {
        opacity: 0;
        transform: translateY(45px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* DESCRIPTION */

.subtitle {
    margin-top: 40px;

    max-width: 480px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.8;

    color: #5e5146;

    opacity: 0;

    animation: fadeUp 1s ease 0.7s forwards;
}


/* SCROLL */

.scroll {
    margin-top: 75px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: #66564a;

    opacity: 0;

    animation:
        fadeUp 1s ease 1s forwards,
        pulse 2.5s ease-in-out 2s infinite;
}

@keyframes pulse {

    0%, 100% {
        opacity: 0.45;
    }

    50% {
        opacity: 1;
    }
}


/* FADE */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* GALLERY SECTION */

section {
    max-width: 1150px;

    margin: auto;

    padding: 120px 25px;
}


/* SECTION TITLE */

.section-title {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #66564a;

    margin-bottom: 45px;
}


/* GALLERY */

.gallery {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 28px;
}


/* CARD */

.card {
    position: relative;

    overflow: hidden;

    cursor: pointer;

    background: #eee3d4;

    border: 1px solid rgba(72,53,39,0.15);

    box-shadow:
        0 15px 40px rgba(70,50,35,0.12);

    transition:
        transform 0.5s ease,
        box-shadow 0.5s ease;
}

.card:hover {

    transform: translateY(-8px);

    box-shadow:
        0 25px 60px rgba(70,50,35,0.20);
}


/* IMAGE */

.card img {

    width: 100%;

    display: block;

    transition:
        transform 0.8s ease,
        filter 0.8s ease;
}

.card:hover img {

    transform: scale(1.045);

    filter: brightness(1.04);
}


/* VIEW LABEL */

.card::before {

    content: "VIEW";

    position: absolute;

    top: 18px;
    right: 18px;

    z-index: 2;

    padding: 9px 12px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 3px;

    color: white;

    background: rgba(45,34,26,0.70);

    backdrop-filter: blur(8px);

    opacity: 0;

    transform: translateY(-5px);

    transition: 0.4s ease;
}

.card:hover::before {

    opacity: 1;

    transform: translateY(0);
}


/* CAPTION */

.card figcaption {

    padding: 18px;

    background: #e9dccb;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 1px;

    color: #655548;
}


/* THIRD IMAGE WIDE */

.card:nth-child(3) {
    grid-column: span 2;
}


/* QUOTE */

.quote {

    padding: 170px 25px;

    text-align: center;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(113,82,58,0.08),
            transparent
        );
}

.quote h2 {

    font-size: clamp(40px, 8vw, 80px);

    font-weight: 400;

    line-height: 1;

    letter-spacing: -3px;

    color: #30261f;
}

.quote p {

    margin-top: 30px;

    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: 2px;

    color: #776557;
}


/* FOOTER */

footer {

    padding: 50px 25px;

    text-align: center;

    border-top: 1px solid rgba(60,45,35,0.12);

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 4px;

    color: #705f51;
}


/* LIGHTBOX */

.lightbox {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 1000;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background: rgba(30,23,19,0.94);

    backdrop-filter: blur(12px);
}

.lightbox.active {

    display: flex;

    animation: lightboxFade 0.35s ease;
}

@keyframes lightboxFade {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* ENLARGED IMAGE */

.lightbox img {

    max-width: 94%;

    max-height: 88vh;

    object-fit: contain;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.60);

    animation: imageZoom 0.4s ease;
}

@keyframes imageZoom {

    from {
        transform: scale(0.92);
    }

    to {
        transform: scale(1);
    }
}


/* CLOSE BUTTON */

.lightbox-close {

    position: absolute;

    top: 20px;
    right: 25px;

    width: 45px;
    height: 45px;

    display: flex;

    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,0.25);

    border-radius: 50%;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 30px;

    cursor: pointer;

    transition: 0.3s ease;
}

.lightbox-close:hover {

    background: rgba(255,255,255,0.12);

    transform: rotate(90deg);
}


/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 35px 22px;
    }

    .artist {
        font-size: 14px;
        letter-spacing: 5px;
        margin-bottom: 50px;
    }

    h1 {
        font-size: clamp(55px, 17vw, 90px);
        letter-spacing: -4px;
    }

    .subtitle {
        font-size: 13px;
    }

    section {
        padding: 90px 18px;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .card:nth-child(3) {
        grid-column: span 1;
    }

    .quote {
        padding: 120px 20px;
    }

    .quote h2 {
        letter-spacing: -2px;
    }

}

</style>

</head>


<body>


<!-- HERO -->

<header>

    <div class="artist">
        SOHAM SHINDE
    </div>

    <div class="small">
        Personal Art Archive
    </div>

    <h1>
        THE<br>
        SKETCHBOOK
    </h1>

    <p class="subtitle">
        A collection of drawings, experiments and moments
        captured one line at a time.
    </p>

    <div class="scroll">
        SCROLL TO EXPLORE ↓
    </div>

</header>


<!-- GALLERY -->

<section>

    <div class="section-title">
        Selected Works
    </div>

    <div class="gallery">


        <!-- SKETCH 1 -->

        <figure class="card">

            <img
                src="IMG_20251013_202149934.jpg"
                alt="Portrait Study"
                onclick="openLightbox(this)"
            >

            <figcaption>
                01 — Portrait Study
            </figcaption>

        </figure>


        <!-- SKETCH 2 -->

        <figure class="card">

            <img
                src="IMG_20250502_143322888.jpg"
                alt="Study in Pencil"
                onclick="openLightbox(this)"
            >

            <figcaption>
                02 — Study in Pencil
            </figcaption>

        </figure>


        <!-- SKETCH 3 -->

        <figure class="card">

            <img
                src="IMG_20250317_140833650.jpg"
                alt="Character Study"
                onclick="openLightbox(this)"
            >

            <figcaption>
                03 — Character Study
            </figcaption>

        </figure>


        <!-- SKETCH 4 -->

        <figure class="card">

            <img
                src="IMG_20250308_175310628.jpg"
                alt="Another Beginning"
                onclick="openLightbox(this)"
            >

            <figcaption>
                04 — Another Beginning
            </figcaption>

        </figure>


    </div>

</section>


<!-- QUOTE -->

<div class="quote">

    <h2>
        I didn't realise<br>
        I was improving.
    </h2>

    <p>
        A collection of the journey so far
    </p>

</div>


<!-- FOOTER -->

<footer>

    SOHAM SHINDE · THE SKETCHBOOK · 2026

</footer>


<!-- LIGHTBOX -->

<div
    class="lightbox"
    id="lightbox"
    onclick="closeLightbox(event)"
>

    <span
        class="lightbox-close"
        onclick="closeLightbox(event)"
    >
        &times;
    </span>


    <img
        id="lightboxImage"
        src=""
        alt="Enlarged sketch"
        onclick="event.stopPropagation()"
    >

</div>


<!-- JAVASCRIPT -->

<script>

function openLightbox(image) {

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    lightboxImage.src = image.src;

    lightbox.classList.add("active");
}


function closeLightbox(event) {

    if (
        event.target.id === "lightbox" ||
        event.target.classList.contains("lightbox-close")
    ) {

        document
            .getElementById("lightbox")
            .classList.remove("active");
    }
}


/* ESCAPE KEY CLOSE */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        document
            .getElementById("lightbox")
            .classList.remove("active");

    }

});

</script>


</body>
    </html>
