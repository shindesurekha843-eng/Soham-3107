<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soham Shinde | The Sketchbook</title>

<style>

/* RESET */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #d6c2aa;
    color: #2c241e;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255,255,255,0.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 30%,
            rgba(139,95,65,0.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 40% 90%,
            rgba(110,75,50,0.16),
            transparent 35%
        );
}


/* HERO */

header {
    min-height: 100vh;
    padding: 45px 30px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.55),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(121,83,59,0.25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eadcca,
            #d3bca0,
            #b99b7d
        );
}


/* SOFT MOVING LIGHT */

header::after {
    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    border-radius: 50%;

    background: rgba(255,255,255,0.17);

    filter: blur(75px);

    right: -100px;
    top: 15%;

    animation: floatingLight 8s ease-in-out infinite alternate;
}

@keyframes floatingLight {

    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(100px);
    }
}


/* ARTIST NAME */

.artist {
    font-family: "Times New Roman", serif;

    font-size: 18px;

    letter-spacing: 7px;

    color: #493a2f;

    text-transform: uppercase;

    margin-bottom: 65px;

    opacity: 0;

    animation: fadeUp 1s ease forwards;
}


/* SMALL TITLE */

.small {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    color: #705f50;

    text-transform: uppercase;

    margin-bottom: 25px;

    opacity: 0;

    animation: fadeUp 1s ease 0.2s forwards;
}


/* MAIN TITLE */

h1 {
    font-size: clamp(60px, 14vw, 135px);

    line-height: 0.82;

    font-weight: 400;

    letter-spacing: -6px;

    color: #2c241e;

    opacity: 0;

    animation: titleReveal 1.3s ease 0.3s forwards;
}

@keyframes titleReveal {

    from {
        opacity: 0;
        transform: translateY(45px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* DESCRIPTION */

.subtitle {
    margin-top: 40px;

    max-width: 480px;

    font-family: Arial, sans-serif;

    font-size: 14px;

    line-height: 1.8;

    color: #5e5146;

    opacity: 0;

    animation: fadeUp 1s ease 0.7s forwards;
}


/* SCROLL */

.scroll {
    margin-top: 75px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 4px;

    color: #66564a;

    opacity: 0;

    animation:
        fadeUp 1s ease 1s forwards,
        pulse 2.5s ease-in-out 2s infinite;
}

@keyframes pulse {

    0%, 100% {
        opacity: 0.45;
    }

    50% {
        opacity: 1;
    }
}


/* FADE */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* GALLERY SECTION */

section {
    max-width: 1150px;

    margin: auto;

    padding: 120px 25px;
}


/* SECTION TITLE */

.section-title {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: 5px;

    text-transform: uppercase;

    color: #66564a;

    margin-bottom: 45px;
}


/* GALLERY */

.gallery {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 28px;
}


/* CARD */

.card {
    position: relative;

    overflow: hidden;

    cursor: pointer;

    background: #eee3d4;

    border: 1px solid rgba(72,53,39,0.15);

    box-shadow:
        0 15px 40px rgba(70,50,35,0.12);

    transition:
        transform 0.5s ease,
        box-shadow 0.5s ease;
}

.card:hover {

    transform: translateY(-8px);

    box-shadow:
        0 25px 60px rgba(70,50,35,0.20);
}


/* IMAGE */

.card img {

    width: 100
